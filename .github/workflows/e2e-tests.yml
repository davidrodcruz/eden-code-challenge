name: E2E Tests - Eden PACS MPR

on:
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [run-tests-webhook]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: eden-code-challenge-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run E2E tests
        id: tests
        continue-on-error: true
        run: docker compose run --rm tests -t eden --headless

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: e2e-tests
          message: |
            ## E2E Tests - Eden PACS MPR

            ${{ steps.tests.outcome == 'success' && '### Result: Passed 🟢' || '### Result: Failed 🔴' }}

            Tests executed in Docker container (`python:3.11-slim-bookworm`).
            Command: `docker compose run --rm tests -t eden --headless`

            > Allure report and video recordings available in workflow artifacts.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ./results/
          retention-days: 30

      - name: Evaluate test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
